  <style>
    @font-face {
      font-family: 'Recoleta';
      src: url('https://choose.perfectlysnug.com/assets/fonts/recoleta/Recoleta-Regular/Recoleta-Regular.ttf') format('truetype');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Recoleta';
      src: url('https://choose.perfectlysnug.com/assets/fonts/recoleta/Recoleta-Medium/Recoleta-Medium.ttf') format('truetype');
      font-weight: 500; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Recoleta';
      src: url('https://choose.perfectlysnug.com/assets/fonts/recoleta/Recoleta-Bold/Recoleta-Bold.ttf') format('truetype');
      font-weight: 700; font-style: normal; font-display: swap;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --dark-blue: #25343E;
      --light-blue: #E0F0F2;
      --yellow: #F2D980;
      --white: #FFFFFF;
      --grey: #667085;
      --body-text: #3d4a52;
    }
    html, body {
      overflow-x: hidden;
      height: 100%;
    }
    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--dark-blue);
      color: var(--white);
      min-height: 100vh;
    }

    /* ── HERO LAYOUT ── */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── MOBILE: stacked, all centered ── */
    .hero-content {
      flex: 0 0 auto;
      padding: 44px 28px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    /* Award badge */
    .award-badge {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      border: 1.5px solid rgba(255,255,255,0.35);
      border-radius: 999px;
      padding: 9px 20px;
      text-align: center;
      gap: 1px;
    }
    .award-badge .badge-label {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--yellow);
    }
    .award-badge .badge-title {
      font-family: 'Montserrat', sans-serif;
      font-weight: 500;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.9);
      line-height: 1.3;
    }

    /* Headline */
    .hero-headline {
      font-family: 'Recoleta', Georgia, serif;
      font-weight: 500;
      font-size: clamp(2.8rem, 11vw, 4.5rem);
      line-height: 1.08;
      color: var(--white);
      letter-spacing: -0.01em;
      text-align: center;
      width: 100%;
    }
    .hero-headline .accent {
      color: var(--yellow);
    }

    /* Subhead */
    .hero-subhead {
      font-family: 'Montserrat', sans-serif;
      font-weight: 400;
      font-size: 0.95rem;
      line-height: 1.65;
      color: rgba(255,255,255,0.7);
      text-align: center;
      max-width: 340px;
      margin: 0;
    }

    /* Stars */
    .hero-stars {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      flex-wrap: nowrap;
      white-space: nowrap;
    }
    .stars-icons {
      color: var(--yellow);
      font-size: 1rem;
      letter-spacing: 1px;
      flex-shrink: 0;
    }
    .stars-text {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      color: rgba(255,255,255,0.8);
    }
    .stars-text strong {
      color: var(--white);
      font-weight: 700;
    }

    /* CTA button */
    .hero-cta {
      display: block;
      width: 100%;
      background: var(--yellow);
      color: var(--dark-blue);
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-decoration: none;
      text-align: center;
      padding: 20px 36px;
      border-radius: 999px;
      transition: background 0.2s, transform 0.15s;
      margin-top: 4px;
    }
    .hero-cta:hover {
      background: #e8ca6a;
      transform: translateY(-1px);
    }
    .hero-cta:active {
      transform: translateY(0);
    }

    /* Hero image — mobile: tall enough to feel immersive */
    .hero-image {
      flex: 1 1 auto;
      position: relative;
      min-height: 45vh;
    }
    .hero-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }
    /* Gradient fade from dark-blue into image at top */
    .hero-image::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 80px;
      background: linear-gradient(to bottom, var(--dark-blue), transparent);
      z-index: 1;
      pointer-events: none;
    }

    /* ── DESKTOP: side-by-side ── */
    @media (min-width: 768px) {
      .hero {
        flex-direction: row;
        min-height: 100vh;
      }
      .hero-content {
        flex: 0 0 50%;
        max-width: 580px;
        padding: 80px 60px 80px 72px;
        align-items: flex-start;
        justify-content: center;
        gap: 28px;
      }
      .hero-headline {
        font-size: clamp(3rem, 4.5vw, 5rem);
        text-align: left;
      }
      .hero-subhead {
        font-size: 1.05rem;
        text-align: left;
        max-width: 460px;
        color: rgba(255,255,255,0.75);
      }
      .hero-stars {
        justify-content: flex-start;
      }
      .hero-cta {
        width: auto;
        display: inline-block;
        text-transform: none;
        font-size: 0.95rem;
        padding: 16px 36px;
        margin-top: 0;
      }
      .hero-image {
        flex: 1 1 50%;
        min-height: 100vh;
      }
      .hero-image::before {
        top: 0; bottom: 0;
        right: auto;
        width: 80px;
        height: 100%;
        background: linear-gradient(to right, var(--dark-blue), transparent);
      }
    }

    @media (min-width: 1200px) {
      .hero-content {
        padding: 80px 80px 80px 100px;
      }
    }
  </style>
</head>

    <h1 class="hero-headline">

    <p class="hero-subhead">

    </p>

    <div class="hero-stars">
      <span class="stars-icons">★★★★★</span>
      <span class="stars-text"><strong>4.87</strong> &nbsp;·&nbsp; Thousands of happy sleepers</span>
    </div>

    <a href="https://perfectlysnug.com/products/smart-topper" class="hero-cta">
      Shop the Smart Topper
    </a>

  </div>

</section>
