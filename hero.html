  <style>
    @font-face {
      font-family: 'Recoleta';
      src: url('https://choose.perfectlysnug.com/assets/fonts/recoleta/Recoleta-Regular/Recoleta-Regular.ttf') format('truetype');

      font-weight: 500; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Recoleta';
      src: url('https://choose.perfectlysnug.com/assets/fonts/recoleta/Recoleta-Bold/Recoleta-Bold.ttf') format('truetype');
      font-weight: 700; font-style: normal; font-display: swap;

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --dark-blue: #25343E;
      --light-blue: #E0F0F2;
      --yellow: #F2D980;
      --white: #FFFFFF;
      --grey: #667085;
      --body-text: #3d4a52;
    }
    html, body {
      overflow-x: hidden;
      height: 100%;
    }
    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--dark-blue);
      color: var(--white);
      min-height: 100vh;
    }

    /* ── HERO LAYOUT — MOBILE: big image, blue bleeds over bottom ── */
    .hero {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Mobile image — large, with gradient eating bottom 25% */
    .hero-image {
      order: -1;
      position: relative;
      flex: 0 0 45vh;
      height: 45vh;
      overflow: hidden;
    }
    .hero-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
      display: block;
    }
    /* Dark blue bleeds up from bottom of image */
    .hero-image::before {
      display: block;
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        transparent 55%,
        rgba(37,52,62,0.55) 75%,
        var(--dark-blue) 100%
      );
      z-index: 1;
      pointer-events: none;
    }

    /* Mobile text — sits below, merges with gradient */
    .hero-content {
      flex: 1 1 auto;
      padding: 20px 24px 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      background: var(--dark-blue);
    }

    /* Headline */
    .hero-headline {
      font-family: 'Recoleta', Georgia, serif;
      font-weight: 500;
      font-size: clamp(2rem, 8vw, 2.8rem);
      line-height: 1.1;
      color: var(--white);
      letter-spacing: -0.01em;
      text-align: center;
      width: 100%;
    }
    .hero-headline .accent {
      color: var(--yellow);
    }

    /* Subhead */
    .hero-subhead {
      font-family: 'Montserrat', sans-serif;
      font-weight: 400;
      font-size: 0.95rem;
      line-height: 1.65;
      color: rgba(255,255,255,0.7);
      text-align: center;
      max-width: 88%;
      margin: 0;
    }

    /* Stars */
    .hero-stars {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      flex-wrap: nowrap;
      white-space: nowrap;
    }
    .stars-icons {
      color: var(--yellow);
      font-size: 1rem;
      letter-spacing: 1px;
      flex-shrink: 0;
    }
    .stars-text {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      color: rgba(255,255,255,0.8);
    }
    .stars-text strong {
      color: var(--white);
      font-weight: 700;
    }

    /* CTA button */
    .hero-cta {
      align-self: center;
      display: block;
      width: auto;
      background: var(--yellow);
      color: var(--dark-blue);
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      text-decoration: none;
      text-align: center;
      padding: 10px 24px;
      border-radius: 999px;
      transition: background 0.2s, transform 0.15s;
      margin-top: 4px;
    }
    .hero-cta:hover {
      background: #e8ca6a;
      transform: translateY(-1px);
    }
    .hero-cta:active {
      transform: translateY(0);
    }

    /* Trust section wrapper — keeps both rows close together */
    .trust-section {
      display: flex;
      flex-direction: column;
      gap: 7px;
      width: 100%;
    }

    /* Trust pills */
    .trust-pills {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-start;
      gap: 7px;
      width: 100%;
      margin-top: 4px;
    }
    .trust-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1.5px solid rgba(255,255,255,0.28);
      border-radius: 999px;
      padding: 6px 13px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.64rem;
      font-weight: 500;
      color: rgba(255,255,255,0.85);
      white-space: nowrap;
    }
    .trust-pill svg { flex-shrink: 0; }

    /* Trust logos */
    .trust-logos {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      width: 100%;
      margin-top: 0;
    }


    /* ── DESKTOP: side-by-side ── */
    @media (min-width: 768px) {
      .hero {
        flex-direction: row;
        min-height: 100vh;
      }
      .hero-content {
        flex: 0 0 54%;
        max-width: 680px;
        min-height: 100vh;
        padding: 72px 52px 72px 64px;
        align-items: flex-start;
        justify-content: center;
        gap: 20px;
      }
      .hero-headline {
        font-size: clamp(3rem, 4vw, 4.8rem);
        text-align: left;
      }
      .hero-subhead {
        font-size: 1.1rem;
        text-align: left;
        max-width: 460px;
        color: rgba(255,255,255,0.75);
      }
      .hero-stars {
        justify-content: flex-start;
        font-size: 1rem;
      }
      .hero-cta {
        align-self: flex-start;
        width: auto;
        display: inline-block;
        text-transform: none;
        font-size: 1rem;
        padding: 16px 40px;
        margin-top: 0;
      }
      .trust-pills {
        flex-wrap: nowrap;
      }
      .trust-logos {
        justify-content: flex-start;
      }
      .hero-image {
        order: 0;
        position: relative;
        flex: 1 1 50%;
        height: auto;
        min-height: 100vh;
        overflow: hidden;
      }
      .hero-image::before {
        display: block;
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(to right, var(--dark-blue) 0%, transparent 40%);
        pointer-events: none;
      }
    }

    @media (min-width: 1200px) {
      .hero-content {
        padding: 72px 64px 72px 96px;
      }
    }
  </style>
</head>
