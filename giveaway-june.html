  <style>
    @font-face {
      font-family: 'Recoleta';
      src: url('https://choose.perfectlysnug.com/assets/fonts/recoleta/Recoleta-Regular/Recoleta-Regular.ttf') format('truetype');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Recoleta';
      src: url('https://choose.perfectlysnug.com/assets/fonts/recoleta/Recoleta-Bold/Recoleta-Bold.ttf') format('truetype');
      font-weight: 700; font-style: normal; font-display: swap;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --dark-blue: #25343E;
      --light-blue: #E0F0F2;
      --yellow: #F2D980;
      --body-text: #3d4a52;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      color: var(--dark-blue);
      background: #fff;
    }

    /* Hero image — full uncropped */
    .hero {
      width: 100%;
    }
    .hero img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Sticky CTA bar — always visible at bottom of screen */
    .sticky-cta {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(37, 52, 62, 0.92);
      backdrop-filter: blur(6px);
      padding: 14px 24px;
      text-align: center;
      z-index: 100;
      box-shadow: 0 -2px 16px rgba(0,0,0,0.2);
    }
    .sticky-cta a {
      display: inline-block;
      background: #F2D980;
      color: #25343E;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 12px 36px;
      border-radius: 50px;
    }
    .sticky-cta a:hover { background: #e8cc6a; }
    /* Hide sticky bar once user has scrolled to the form */
    .sticky-cta.hidden { display: none; }
      .hero-cta-wrap { position: static; margin-top: -28px; padding-bottom: 8px; }
    }

    .hero-cta {
      display: inline-block;
      background: #F2D980;
      color: #25343E;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 16px 40px;
      border-radius: 50px;
      white-space: nowrap;
      transition: background 0.2s;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
    .hero-cta:hover { background: #e8cc6a; }

    /* Content block */
    .content {
      max-width: 640px;
      margin: 0 auto;
      padding: 56px 24px 64px;
      text-align: center;
    }

    /* Stars divider */
    .stars {
      font-size: 1.1rem;
      letter-spacing: 0.25em;
      color: #B22234;
      margin-bottom: 20px;
    }

    h1 {
      font-family: 'Recoleta', Georgia, serif;
      font-weight: 700;
      font-size: clamp(2rem, 5vw, 2.8rem);
      line-height: 1.2;
      color: var(--dark-blue);
      margin-bottom: 24px;
    }

    .body-copy {
      font-size: 1.05rem;
      line-height: 1.75;
      color: var(--body-text);
      margin-bottom: 40px;
    }

    /* Klaviyo form placeholder */
    .form-wrap {
      /* Klaviyo will inject its own styles — this wrapper just centers it */
    }
  </style>
